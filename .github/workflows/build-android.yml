name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Download Qwen3-1.7B model for APK assets
        working-directory: android-app/app
        run: |
          mkdir -p src/main/assets
          curl -L --fail --retry 3 --progress-bar \
            'https://huggingface.co/Qwen/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q8_0.gguf?download=true' \
            -o src/main/assets/model.gguf
          test "$(stat -c%s src/main/assets/model.gguf)" -gt 1000000000
      - name: Build debug APK
        working-directory: android-app
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
