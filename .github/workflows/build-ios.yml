name: Build JARVIS iOS IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd ios && xcodegen generate --spec project.yml
      - name: Build unsigned app
        run: xcodebuild -project ios/JARVIS.xcodeproj -scheme JARVIS -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA
        run: mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/JARVIS.app Payload/ && zip -qry JARVIS.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-unsigned-ipa
          path: JARVIS.ipa
