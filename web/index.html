<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="/manifest.json"><title>JARVIS</title><style>body{font-family:system-ui;max-width:760px;margin:2rem auto;padding:0 1rem;background:#10151c;color:#eef}textarea,input,button{font:inherit;padding:.7rem;margin:.3rem 0}textarea{width:100%;height:90px}button{cursor:pointer}#log{white-space:pre-wrap;background:#18222d;padding:1rem;min-height:180px;border-radius:8px}</style><h1>JARVIS</h1><p>ローカル優先・執事AI</p><input id="token" type="password" placeholder="LAN接続時のAPIトークン"><div id="log"></div><textarea id="q" placeholder="JARVISへの指示"></textarea><button onclick="send()">送信</button><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');const log=document.querySelector('#log');function add(x){log.textContent+=x+'\n\n'}async function send(){let q=document.querySelector('#q').value;if(!q)return;add('あなた: '+q);let h={'Content-Type':'application/json'};let t=document.querySelector('#token').value;if(t)h['X-JARVIS-Token']=t;let r=await fetch('/chat',{method:'POST',headers:h,body:JSON.stringify({text:q})});let j=await r.json();add('JARVIS: '+(j.reply||j.message||JSON.stringify(j)));}</script>
